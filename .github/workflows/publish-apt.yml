name: Publish signed APT repository

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'scripts/publish-archive.sh'
      - '.github/workflows/publish-apt.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apt-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg unzip curl
      - name: Build packages
        run: |
          set -eu
          for script in packages/*/build.sh; do
            sh "$script"
          done
          for deb in dist/*.deb; do
            dpkg-deb --info "$deb"
          done
      - name: Import signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -eu
          test -n "$APT_SIGNING_KEY" || { echo 'Missing APT_SIGNING_KEY secret' >&2; exit 1; }
          mkdir -p -m 700 "$HOME/.gnupg"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="fpr" { print $10; exit }')"
          test -n "$fingerprint"
          echo "SIGNING_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"
      - name: Build persistent archive and push archive branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish-archive.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
