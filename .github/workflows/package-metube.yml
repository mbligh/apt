name: Build metube

permissions:
  contents: read
  actions: write  # Allow the reusable build to dispatch index publication

on:
  push:
    branches: [main]
    paths:
      - 'packages/metube/**'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/package-build.yml
    with:
      package: metube
    secrets: inherit
