name: Build ytdl-sub

permissions:
  contents: read
  actions: write  # Allow the reusable build to dispatch index publication

on:
  push:
    branches: [main]
    paths:
      - 'packages/ytdl-sub/**'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/package-build.yml
    with:
      package: ytdl-sub
    secrets: inherit
