name: Build ytdl-sub

permissions:
  contents: read
  actions: write  # Allow the reusable build to dispatch index publication

on:
  push:
    branches: [main]
    paths:
      - 'packages/ytdl-sub/**'
      - '.github/workflows/package-ytdl-sub.yml'
      - '.github/workflows/package-build.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: package-ytdl-sub
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/package-build.yml
    with:
      package: ytdl-sub
    secrets: inherit
