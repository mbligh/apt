# Dispatch after upstream cfsolve releases or tools/video/cf-curl changes.
name: Build cfsolve and cf-curl

permissions:
  contents: read
  actions: write  # Reusable builder requests R2 signing/index publication

on:
  push:
    branches: [main]
    paths:
      - 'packages/cfsolve/**'
      - '.github/workflows/package-cfsolve.yml'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/package-build.yml
    with:
      package: cfsolve
    secrets: inherit
