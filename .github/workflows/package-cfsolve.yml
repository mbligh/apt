# Check upstream immutable release and cf-curl source versions before building.
name: Build cfsolve and cf-curl

permissions:
  contents: read
  actions: write  # Reusable builder requests R2 signing/index publication

on:
  push:
    branches: [main]
    paths:
      - 'packages/cfsolve/**'
      - '.github/workflows/package-cfsolve.yml'
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:

concurrency:
  group: package-cfsolve
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/package-build.yml
    with:
      package: cfsolve
    secrets: inherit
