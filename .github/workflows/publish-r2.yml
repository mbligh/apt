name: Publish APT repository to Cloudflare R2

on:
  workflow_run:
    workflows:
      - 'Build deno'
      - 'Build desktop-commander'
      - 'Build imapsync'
      - 'Build mbligh-tools'
      - 'Build metube'
      - 'Build nodejs24'
      - 'Build perccli'
      - 'Build pmtiles'
      - 'Build racadm'
      - 'Build radarr'
      - 'Build rtach'
      - 'Build sfutils'
      - 'Build sonarr'
      - 'Build yt-dlp-sabr'
      - 'Build ytdl-sub'
      - 'Build pypi-roombapy-prime'
      - 'Build pypi-duckdb'
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional successful package build run ID
        type: string
        required: false

permissions:
  contents: read
  actions: read

# Queue metadata updates instead of dropping pending publications.
concurrency:
  group: apt-r2-publish
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    environment: github-pages
    env:
      R2_BUCKET: mbligh-apt
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
      APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Download package artifacts (no builds in publisher)
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -n "$BUILD_RUN_ID" ]; then
            gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name debian-packages --dir dist
          fi
          if compgen -G 'dist/*.deb' >/dev/null; then
            echo 'HAS_DEBS=1' >> "$GITHUB_ENV"
            for deb in dist/*.deb; do
              dpkg-deb --info "$deb"
            done
          else
            echo "::notice::No new Debian artifacts in this run"
            echo 'HAS_DEBS=0' >> "$GITHUB_ENV"
          fi
      - name: Install signing and archive tools
        if: env.HAS_DEBS == '1'
        run: |
          set -euo pipefail
          for value in R2_ACCOUNT_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY APT_SIGNING_KEY; do
            test -n "${!value}" || { echo "::error::Missing secret: $value"; exit 1; }
          done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils gnupg curl
          aws --version
          echo "R2_ENDPOINT=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" >> "$GITHUB_ENV"
      - name: Publish packages and signed APT metadata
        if: env.HAS_DEBS == '1'
        run: |
          set -euo pipefail
          mkdir -p -m 700 "$HOME/.gnupg"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="fpr" {print $10; exit}')"
          test -n "$fingerprint"
          export SIGNING_FINGERPRINT="$fingerprint"
          python3 scripts/r2-publish publish
      - name: Verify public signed APT repository
        if: env.HAS_DEBS == '1'
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 https://apt.mbligh.org/dists/trixie/InRelease -o /tmp/r2-InRelease
          curl -fLsS --retry 3 https://apt.mbligh.org/mbligh-archive-keyring.gpg -o /tmp/r2-keyring.gpg
          gpg --no-default-keyring --keyring /tmp/r2-keyring.gpg --verify /tmp/r2-InRelease
          sudo install -m 0644 /tmp/r2-keyring.gpg /usr/share/keyrings/mbligh-r2.gpg
          echo 'deb [signed-by=/usr/share/keyrings/mbligh-r2.gpg] https://apt.mbligh.org trixie main' | sudo tee /etc/apt/sources.list.d/mbligh-r2.list
          sudo apt-get update
