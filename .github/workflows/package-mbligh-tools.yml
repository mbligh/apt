name: Build mbligh-tools

permissions:
  contents: read
  actions: write  # Allow the reusable build to dispatch index publication

on:
  push:
    branches: [main]
    paths:
      - 'packages/mbligh-tools/**'
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

jobs:
  build:
    uses: ./.github/workflows/package-build.yml
    with:
      package: mbligh-tools
    secrets: inherit
