name: Build agentify-desktop

permissions:
  contents: read
  actions: write

on:
  push:
    branches: [main]
    paths:
      - 'packages/agentify-desktop/**'
      - '.github/workflows/package-agentify-desktop.yml'
      - '.github/workflows/package-build.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check published version before downloading dependencies
        id: version
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          source packages/agentify-desktop/version
          package_version="${VERSION}-${REVISION}"
          curl -fLsS --retry 3 \
            https://apt.mbligh.org/dists/trixie/main/binary-amd64/Packages.gz \
            -o /tmp/agentify-Packages.gz
          gzip -cd /tmp/agentify-Packages.gz > /tmp/agentify-Packages
          if awk -v wanted="$package_version" '
              BEGIN { RS = "" }
              /(^|\n)Package: agentify-desktop(\n|$)/ {
                n = split($0, lines, "\n")
                for (i = 1; i <= n; i++)
                  if (lines[i] == "Version: " wanted) found = 1
              }
              END { exit !found }
            ' /tmp/agentify-Packages; then
            if [[ "$GITHUB_EVENT_NAME" == push ]]; then
              # A workflow-only change does not modify the package recipe.
              if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
                echo "::error::Cannot determine whether packaging changed; compare the push base before rebuilding."
                exit 1
              fi
              if ! git diff --quiet "$BEFORE_SHA" HEAD -- packages/agentify-desktop/; then
                echo "::error::Already published $package_version; bump REVISION for packaging changes."
                exit 1
              fi
            fi
            echo "agentify-desktop $package_version already published; skipping unchanged package."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/package-build.yml
    with:
      package: agentify-desktop
    secrets: inherit
