name: Build yt-dlp-sabr

permissions:
  contents: read
  actions: write  # Allow the reusable build to dispatch index publication

on:
  push:
    branches: [main]
    paths:
      - 'packages/yt-dlp-sabr/**'
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

jobs:
  build:
    uses: ./.github/workflows/package-build.yml
    with:
      package: yt-dlp-sabr
    secrets: inherit
