name: Build pypi-roombapy-prime

permissions:
  contents: read
  actions: write  # Allow the reusable build to dispatch index publication

on:
  push:
    branches: [main]
    paths:
      - 'pypi-packages.txt'
      - 'scripts/build-pypi-debs'
      - 'pypi-locks/roombapy-prime.txt'
      - 'pypi-revisions.txt'
      - 'pypi-exposed.txt'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/package-build.yml
    with:
      package: pypi-roombapy-prime
    secrets: inherit
