name: Build one Debian package (reusable)

on:
  workflow_call:
    inputs:
      package:
        description: One package directory or pypi-<name>
        type: string
        required: true

permissions:
  contents: read
  actions: write  # Dispatch the index publisher only for staged packages

jobs:
  preflight:
    if: startsWith(inputs.package, 'pypi-') || inputs.package == 'ytdl-sub' || inputs.package == 'cfsolve'
    runs-on: ubuntu-24.04
    environment: github-pages
    outputs:
      build: ${{ steps.check.outputs.build || steps.ytdl.outputs.build || steps.cfsolve.outputs.build }}
      cfsolve_version: ${{ steps.cfsolve.outputs.version }}
      cfsolve_release: ${{ steps.cfsolve.outputs.release }}
      cfsolve_tools_ref: ${{ steps.cfsolve.outputs.tools_ref }}
      ytdl_sub_release: ${{ steps.ytdl.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check PyPI package version before installing build dependencies
        if: startsWith(inputs.package, 'pypi-')
        id: check
        env:
          PACKAGE: ${{ inputs.package }}
          BEFORE_SHA: ${{ github.event.before }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          for variable in R2_ACCOUNT_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            test -n "${!variable}" || { echo "::error::Missing R2 secret: $variable"; exit 1; }
          done
          aws --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" s3api get-object \
            --bucket mbligh-apt --key dists/trixie/main/binary-amd64/Packages.gz \
            /tmp/apt-Packages.gz >/dev/null
          python3 scripts/check-pypi-build --package "${PACKAGE#pypi-}" \
            --index-file /tmp/apt-Packages.gz --output "$GITHUB_OUTPUT"
      - name: Resolve latest ytdl-sub release and check published version
        if: inputs.package == 'ytdl-sub'
        id: ytdl
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/jmbannon/ytdl-sub/releases/latest \
            -o /tmp/ytdl-sub-release.json
          release=$(python3 packages/ytdl-sub/release-info < /tmp/ytdl-sub-release.json)
          read -r version asset_id digest epoch <<< "$release"
          revision=$(cat packages/ytdl-sub/revision)
          [[ "$revision" =~ ^[1-9][0-9]*$ ]]
          wanted="$version-$revision"
          curl -fLsS --retry 3 \
            https://apt.mbligh.org/dists/trixie/main/binary-amd64/Packages.gz \
            -o /tmp/ytdl-sub-Packages.gz
          gzip -cd /tmp/ytdl-sub-Packages.gz > /tmp/ytdl-sub-Packages
          # Validate the index before treating a missing package as unpublished.
          grep -q '^Package: ' /tmp/ytdl-sub-Packages
          mapfile -t published < <(awk '
            BEGIN { RS = ""; FS = "\n" }
            {
              package = version = arch = filename = digest = ""
              for (i=1; i<=NF; i++) {
                if ($i ~ /^Package: /) package = substr($i, 10)
                if ($i ~ /^Version: /) version = substr($i, 10)
                if ($i ~ /^Architecture: /) arch = substr($i, 15)
                if ($i ~ /^Filename: /) filename = substr($i, 11)
                if ($i ~ /^SHA256: /) digest = substr($i, 9)
              }
              if (package == "ytdl-sub" && arch == "amd64" && version != "" && filename != "" && digest != "")
                print version
            }
          ' /tmp/ytdl-sub-Packages)
          for existing in "${published[@]}"; do
            if dpkg --compare-versions "$existing" ge "$wanted"; then
              if [[ "$existing" == "$wanted" && "$GITHUB_EVENT_NAME" == push ]]; then
                git cat-file -e "${BEFORE_SHA}^{commit}" || {
                  echo "::error::Cannot inspect push base to verify revision bump."
                  exit 1
                }
                if ! git diff --quiet "$BEFORE_SHA" HEAD -- packages/ytdl-sub/; then
                  echo "::error::Already published $wanted; bump packages/ytdl-sub/revision for packaging changes."
                  exit 1
                fi
              fi
              echo "ytdl-sub $existing already published (candidate $wanted); skipping download and build."
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Unpublished ytdl-sub $wanted; build required."
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - name: Checkout cf-curl for version preflight
        if: inputs.package == 'cfsolve'
        uses: actions/checkout@v5
        with:
          repository: mbligh/tools
          ref: master
          ssh-key: ${{ secrets.TOOLS_DEPLOY_KEY }}
          path: private-tools
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            video/cf-curl
          sparse-checkout-cone-mode: false
      - name: Check cfsolve version before downloading binary or building
        if: inputs.package == 'cfsolve'
        id: cfsolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          for variable in R2_ACCOUNT_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            test -n "${!variable}" || { echo "::error::Missing R2 secret: $variable"; exit 1; }
          done
          resolved=$(sh packages/cfsolve/build.sh --resolve)
          read -r wanted release tools_ref <<< "$resolved"
          [[ "$wanted" =~ ^0\.[0-9]{14}\+cf[0-9a-f]{12}\.t[0-9a-f]{12}-[0-9]+$ ]]
          [[ "$release" =~ ^build-[0-9a-f]{12}$ ]]
          [[ "$tools_ref" =~ ^[0-9a-f]{40}$ ]]
          aws --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" s3api get-object \
            --bucket mbligh-apt --key dists/trixie/main/binary-amd64/Packages.gz \
            /tmp/cfsolve-Packages.gz >/dev/null
          gzip -cd /tmp/cfsolve-Packages.gz > /tmp/cfsolve-Packages
          grep -q '^Package: ' /tmp/cfsolve-Packages
          published=$(awk '
            BEGIN { RS = ""; FS = "\n" }
            {
              package = version = arch = filename = digest = ""
              for (i=1; i<=NF; i++) {
                if ($i ~ /^Package: /) package = substr($i,10)
                if ($i ~ /^Version: /) version = substr($i,10)
                if ($i ~ /^Architecture: /) arch = substr($i,15)
                if ($i ~ /^Filename: /) filename = substr($i,11)
                if ($i ~ /^SHA256: /) digest = substr($i,9)
              }
              if (package == "cfsolve" && arch == "amd64" && version != "" && filename != "" && digest != "")
                print version
            }
          ' /tmp/cfsolve-Packages)
          for existing in $published; do
            if dpkg --compare-versions "$existing" ge "$wanted"; then
              echo "cfsolve $existing already published (candidate $wanted); skipping."
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Unpublished cfsolve $wanted; build required."
          printf 'build=true\nversion=%s\nrelease=%s\ntools_ref=%s\n' \
            "$wanted" "$release" "$tools_ref" >> "$GITHUB_OUTPUT"
  build:
    needs: preflight
    if: ${{ always() && (needs.preflight.result == 'skipped' || (needs.preflight.result == 'success' && needs.preflight.outputs.build == 'true')) }}
    runs-on: ubuntu-24.04
    environment: github-pages
    steps:
      - uses: actions/checkout@v5
      - name: Install packaging prerequisites
        run: |
          # These prerequisites are all from Ubuntu. Do not let unrelated
          # third-party repositories on the hosted runner break this build.
          test -s /etc/apt/sources.list.d/ubuntu.sources
          apt_options=(
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
            -o Dir::Etc::sourceparts=-
            -o Acquire::Retries=3
          )
          sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends dpkg-dev curl unzip alien rpm fakeroot python3-venv python3-pip
      - name: Install Node 24 for JavaScript builds
        if: inputs.package == 'desktop-commander' || inputs.package == 'metube' || inputs.package == 'jellyfin-web' || inputs.package == 'agentify-desktop'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable Corepack for MeTube frontend build
        if: inputs.package == 'metube'
        run: |
          npm install --global corepack
          corepack enable
      - name: Install Python 3.13 for PyPI or MeTube
        if: startsWith(inputs.package, 'pypi-') || inputs.package == 'metube'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Require private tools deploy key
        if: inputs.package == 'mbligh-tools' || inputs.package == 'cfsolve'
        env:
          TOOLS_DEPLOY_KEY: ${{ secrets.TOOLS_DEPLOY_KEY }}
        run: |
          test -n "$TOOLS_DEPLOY_KEY" || { echo "::error::Missing TOOLS_DEPLOY_KEY"; exit 1; }
      - name: Checkout tools/g for mbligh-tools
        if: inputs.package == 'mbligh-tools'
        uses: actions/checkout@v5
        with:
          repository: mbligh/tools
          ref: master
          ssh-key: ${{ secrets.TOOLS_DEPLOY_KEY }}
          path: private-tools
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            tools/g
          sparse-checkout-cone-mode: false
      - name: Checkout tools/video/cf-curl for cfsolve
        if: inputs.package == 'cfsolve'
        uses: actions/checkout@v5
        with:
          repository: mbligh/tools
          ref: ${{ needs.preflight.outputs.cfsolve_tools_ref }}
          ssh-key: ${{ secrets.TOOLS_DEPLOY_KEY }}
          path: private-tools
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            video/cf-curl
          sparse-checkout-cone-mode: false
      - name: Stage tools/g with source-derived version
        if: inputs.package == 'mbligh-tools'
        run: |
          set -euo pipefail
          test -f private-tools/tools/g
          commit="$(git -C private-tools log -1 --format=%H -- tools/g)"
          timestamp="$(git -C private-tools log -1 --format=%ct -- tools/g)"
          version="0.$(date -u -d "@$timestamp" +%Y%m%d%H%M%S)+git${commit:0:12}-2"
          install -m 644 private-tools/tools/g packages/mbligh-tools/upstream-g
          printf '%s\n' "$version" > packages/mbligh-tools/upstream-version
          echo "Packaging tools/g at $commit as $version"
      - name: Build ${{ inputs.package }}
        env:
          PACKAGE: ${{ inputs.package }}
          GH_TOKEN: ${{ github.token }}
          YTDL_SUB_RELEASE: ${{ needs.preflight.outputs.ytdl_sub_release }}
          CFSOLVE_RELEASE_TAG: ${{ needs.preflight.outputs.cfsolve_release }}
          CFSOLVE_EXPECTED_VERSION: ${{ needs.preflight.outputs.cfsolve_version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          echo "::group::Build $PACKAGE"
          # Close the GitHub log group even when setup or packaging fails.
          trap 'echo "::endgroup::"' EXIT
          rc=0
          if [[ "$PACKAGE" == pypi-* ]]; then
            curl -fLsS --retry 3 https://deb.debian.org/debian/dists/trixie/main/binary-amd64/Packages.xz -o /tmp/debian-trixie-Packages.xz
            python -m venv /tmp/pypi-packager
            /tmp/pypi-packager/bin/pip install 'pip==26.2.2'
            /tmp/pypi-packager/bin/python scripts/build-pypi-debs --package "${PACKAGE#pypi-}" --debian-packages /tmp/debian-trixie-Packages.xz || rc=$?
          else
            test -f "packages/$PACKAGE/build.sh"
            sh "packages/$PACKAGE/build.sh" || rc=$?
          fi
          echo "::endgroup::"
          trap - EXIT
          if (( rc != 0 )); then
            echo "::error::Build $PACKAGE failed (exit $rc)"
            exit "$rc"
          fi
          if ! compgen -G 'dist/*.deb' > /dev/null; then
            if [[ "$PACKAGE" == pypi-* ]]; then
              echo "::notice::Debian already provides this PyPI package, no artifact needed"
              printf '%s\n' "No package generated for $PACKAGE" > dist/no-package.txt
            else
              echo "::error::Build succeeded without producing a .deb"
              exit 1
            fi
          fi
      - name: Validate packages and run package-specific tests
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(dist/*.deb)
          for deb in "${debs[@]}"; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb" >/dev/null
            echo "Verified package: $deb"
          done
          case "$PACKAGE" in
            get-iplayer)
              docker run --rm -v "$PWD/dist:/pkgs:ro" debian:trixie sh -ec '
                apt-get update -qq
                apt-get install -y --no-install-recommends /pkgs/get-iplayer_*.deb
                command -v get_iplayer
                get_iplayer --version
                perl -c /usr/bin/get_iplayer
                grep -Fq "Skipping DASH manifest without constant segment duration" /usr/bin/get_iplayer
              '
              ;;
            sfutils)
              docker run --rm -v "$PWD/dist:/pkgs:ro" debian:trixie sh -ec '
                apt-get update -qq
                apt-get install -y --no-install-recommends /pkgs/sfutils_*.deb
                command -v sfupdate
                command -v sfboot
              '
              ;;
            racadm)
              docker run --rm -v "$PWD/dist:/pkgs:ro" debian:trixie sh -ec '
                apt-get update -qq
                apt-get -s install /pkgs/srvadmin-hapi*.deb /pkgs/srvadmin-idracadm7*.deb /pkgs/srvadmin-idracadm8*.deb
              '
              ;;
            ytdl-sub)
              docker run --rm -v "$PWD/dist:/pkgs:ro" debian:trixie sh -ec '
                apt-get update -qq
                apt-get install -y --no-install-recommends /pkgs/ytdl-sub_*.deb
                env -u SSL_CERT_FILE timeout 60 ytdl-sub -h > /tmp/ytdl-sub-help.txt
                test -s /tmp/ytdl-sub-help.txt
              '
              ;;
            cfsolve)
              docker run --rm -v "$PWD/dist:/pkgs:ro" debian:trixie sh -ec '
                apt-get update -qq
                apt-get install -y --no-install-recommends /pkgs/cfsolve_*.deb
                test -x /usr/bin/cfsolve
                test -x /usr/bin/challenge
                test -x /usr/bin/cf-curl
                test -s /usr/share/cfsolve/profiles/safari-26-ios.json
                cfsolve --help >/dev/null
                challenge --help >/dev/null
                cf-curl --help >/dev/null
                python3 -c "import os,runpy; from pathlib import Path; [os.environ.pop(k,None) for k in (\"CFSOLVE_DIR\",\"CFSOLVE_BIN\",\"CFSOLVE_PROFILE\")]; ns=runpy.run_path(\"/usr/bin/cf-curl\"); binary,profile=ns[\"backend_paths\"](); assert binary == Path(\"/usr/bin/cfsolve\"),binary; assert profile == Path(\"/usr/share/cfsolve/profiles/safari-26-ios.json\"),profile; assert ns[\"profile_user_agent\"](profile)"
              '
              ;;
            agentify-desktop)
              . packages/agentify-desktop/version
              docker run --rm -e AGENTIFY_EXPECTED_VERSION="$VERSION" \
                -v "$PWD/dist:/pkgs:ro" debian:trixie sh -ec '
                apt-get update -qq
                apt-get install -y --no-install-recommends ca-certificates curl
                curl -fLsS --retry 3 https://apt.mbligh.org/mbligh-archive-keyring.gpg -o /usr/share/keyrings/mbligh-archive-keyring.gpg
                echo "deb [signed-by=/usr/share/keyrings/mbligh-archive-keyring.gpg] https://apt.mbligh.org trixie main" > /etc/apt/sources.list.d/mbligh.list
                apt-get update -qq
                apt-get install -y --no-install-recommends /pkgs/agentify-desktop_*.deb
                test "$(node24 -p "require(\"/usr/lib/agentify-desktop/package.json\").version")" = "$AGENTIFY_EXPECTED_VERSION"
                command -v agentify-desktop
                command -v agentify-desktop-mcp
                command -v agentify-desktop-gui
                agentify-desktop --help | grep -Fq "Agentify Desktop"
                agentify-desktop-mcp --help | grep -Fq "Agentify Desktop"
                test -x /usr/lib/agentify-desktop/node_modules/electron/dist/electron
                test -u /usr/lib/agentify-desktop/node_modules/electron/dist/chrome-sandbox
                test ! -e /usr/bin/npm
                node24 --check /usr/lib/agentify-desktop/main.mjs
                node24 --check /usr/lib/agentify-desktop/mcp-server.mjs
                if ldd /usr/lib/agentify-desktop/node_modules/electron/dist/electron | grep -F "not found"; then
                  echo "Missing Electron shared libraries" >&2
                  exit 1
                fi
              '
              if dpkg-deb -f dist/agentify-desktop_*.deb Depends | grep -Eq '(^|[, ])(npm|npx)([, (]|$)'; then
                echo "::error::npm/npx runtime dependency is forbidden"
                exit 1
              fi
              ;;
            opencode)
              . packages/opencode/version
              docker run --rm -e OPENCODE_EXPECTED_VERSION="$VERSION" -v "$PWD/dist:/pkgs:ro" debian:trixie sh -ec '
                apt-get update -qq
                apt-get install -y --no-install-recommends /pkgs/opencode_*.deb
                command -v opencode
                timeout 30 opencode --version | grep -Fq "$OPENCODE_EXPECTED_VERSION"
                timeout 30 opencode --help > /tmp/opencode-help.txt
                test -s /tmp/opencode-help.txt
                test ! -e /usr/bin/npm
              '
              if dpkg-deb -f dist/opencode_*.deb Depends | grep -Eq '(^|[, ])(nodejs|npm|bun)([, (]|$)'; then
                echo "::error::OpenCode must not depend on npm, Node.js or Bun packages"
                exit 1
              fi
              ;;
            pmtiles)
              mkdir -p /tmp/pmtiles-extracted
              dpkg-deb -x dist/pmtiles_*.deb /tmp/pmtiles-extracted
              /tmp/pmtiles-extracted/usr/bin/pmtiles --help
              ;;
            nodejs24)
              mkdir -p /tmp/nodejs24-extracted
              dpkg-deb -x dist/nodejs24_*.deb /tmp/nodejs24-extracted
              /tmp/nodejs24-extracted/usr/lib/nodejs24/bin/node --version
              ;;
            desktop-commander)
              mkdir -p /tmp/desktop-commander-extracted
              dpkg-deb -x dist/desktop-commander_*.deb /tmp/desktop-commander-extracted
              node --check /tmp/desktop-commander-extracted/usr/lib/desktop-commander/node_modules/@wonderwhy-er/desktop-commander/dist/index.js
              ;;
            pypi-plexapi)
              # Install on the target distro and verify an ordinary Python import.
              docker run --rm -v "$PWD/dist:/pkgs:ro" debian:trixie sh -ec '
                apt-get update -qq
                apt-get install -y --no-install-recommends /pkgs/pypi-plexapi_*.deb
                python3 -c "from plexapi.server import PlexServer; import plexapi; assert plexapi.__file__.startswith(\"/usr/lib/pypi-plexapi/\")"
              '
              ;;
            jellyfin-web)
              mkdir -p /tmp/jellyfin-web-extracted
              dpkg-deb -x dist/jellyfin-web_*.deb /tmp/jellyfin-web-extracted
              test -s /tmp/jellyfin-web-extracted/usr/share/jellyfin/web/index.html
              test -s /tmp/jellyfin-web-extracted/usr/share/jellyfin/web/config.json
              test -s /tmp/jellyfin-web-extracted/usr/share/jellyfin/web/serviceworker.js
              test ! -d /tmp/jellyfin-web-extracted/usr/share/jellyfin/web/node_modules
              dpkg-deb -f dist/jellyfin-web_*.deb Package | grep -qx jellyfin-web
              dpkg-deb -f dist/jellyfin-web_*.deb Architecture | grep -qx all
              dpkg-deb -f dist/jellyfin-web_*.deb Depends | grep -qvE 'nodejs|npm' || test -z "$(dpkg-deb -f dist/jellyfin-web_*.deb Depends)"
              dpkg-deb --ctrl-tarfile dist/jellyfin-web_*.deb | tar -xOf - ./conffiles | grep -qx /usr/share/jellyfin/web/config.json
              ;;
            mbligh-tools)
              mkdir -p /tmp/mbligh-tools-extracted
              dpkg-deb -x dist/mbligh-tools_*.deb /tmp/mbligh-tools-extracted
              python3 -m py_compile /tmp/mbligh-tools-extracted/usr/bin/g
              ;;
          esac
      - name: Upload successful package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: debian-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload immutable packages to R2 in this build job
        id: stage
        env:
          R2_BUCKET: mbligh-apt
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          for value in R2_ACCOUNT_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            test -n "${!value}" || { echo "::error::Missing R2 upload secret: $value"; exit 1; }
          done
          python3 -m py_compile scripts/r2-publish
          aws --version
          python3 scripts/r2-publish stage "$GITHUB_RUN_ID"

      - name: Request signed APT index update
        if: steps.stage.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run publish-r2.yml --repo "$GITHUB_REPOSITORY" \
            --ref main --field "run_id=$GITHUB_RUN_ID"
