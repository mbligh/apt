name: Build pypi-duckdb

on:
  push:
    branches: [main]
    paths:
      - 'pypi-packages.txt'
      - 'scripts/build-pypi-debs'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 0'

jobs:
  build:
    uses: ./.github/workflows/package-build.yml
    with:
      package: pypi-duckdb
    secrets: inherit
