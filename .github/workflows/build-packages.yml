name: Build Debian packages
on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/**'
      - '.github/workflows/build-packages.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y unzip dpkg-dev curl alien rpm fakeroot
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_package() {
            local name="$1" rc=0
            echo "::group::Build $name"
            sh "packages/$name/build.sh" || rc=$?
            echo "::endgroup::"
            return "$rc"
          }
          build_optional_package() {
            local name="$1" rc=0
            echo "::group::Build $name (optional)"
            sh "packages/$name/build.sh" || rc=$?
            echo "::endgroup::"
            if [ "$rc" -eq 75 ]; then
              echo "::warning title=$name unavailable::Upstream download unavailable; skipping optional package"
            elif [ "$rc" -ne 0 ]; then
              return "$rc"
            fi
          }
          build_package deno
          build_package pmtiles
          build_package ytdl-sub
          build_package perccli
          build_package racadm
          build_package sfutils
          build_optional_package yt-dlp-sabr
          build_package nodejs24
          build_package desktop-commander
          build_package imapsync
          build_package radarr
          build_package sonarr
      - name: Verify Solarflare utilities on Debian 13
        run: |
          docker run --rm -v "$PWD/dist:/pkgs:ro" debian:trixie sh -ec '
            apt-get update -qq
            apt-get install -y --no-install-recommends /pkgs/sfutils_*.deb
            command -v sfupdate
            command -v sfboot
            test -x /usr/sbin/sfupdate || test -x /usr/bin/sfupdate
          '
      - name: Verify RACADM dependencies against Debian 13
        run: |
          docker run --rm -v "$PWD/dist:/pkgs:ro" debian:trixie sh -ec '
            apt-get update -qq
            apt-get -s install /pkgs/srvadmin-hapi*.deb /pkgs/srvadmin-idracadm7*.deb /pkgs/srvadmin-idracadm8*.deb
          '
      - name: Test PMTiles CLI
        run: |
          sudo dpkg -i dist/pmtiles_*.deb
          pmtiles --help
          pmtiles extract --help
          pmtiles show --help
      - name: Test ytdl-sub on Debian 13
        run: |
          docker run --rm -v "$PWD/dist:/pkgs:ro" debian:trixie sh -ec '
            apt-get update -qq
            apt-get install -y --no-install-recommends /pkgs/ytdl-sub_*.deb
            test -x /usr/lib/ytdl-sub/ytdl-sub
            test -f /etc/ssl/certs/ca-certificates.crt
            sh -n /usr/bin/ytdl-sub
            grep -Fq "SSL_CERT_FILE:=/etc/ssl/certs/ca-certificates.crt" /usr/bin/ytdl-sub
            env -u SSL_CERT_FILE timeout 60 ytdl-sub -h >/tmp/ytdl-sub-help.txt
            test -s /tmp/ytdl-sub-help.txt
          '
      - name: Inspect packages
        run: |
          for f in dist/*.deb; do
            dpkg-deb --info "$f"
            dpkg-deb --contents "$f"
          done
      - name: Test Desktop Commander installation with separate Node 24
        run: |
          sudo apt-get install -y ./dist/nodejs24_*.deb ./dist/desktop-commander_*.deb
          test "$(node24 --version)" = v24.22.2
          node24 --check /usr/lib/desktop-commander/node_modules/@wonderwhy-er/desktop-commander/dist/index.js
          timeout 20s desktop-commander remote --help >/tmp/desktop-commander-help.txt
          test -s /tmp/desktop-commander-help.txt
          dpkg-query -W -f='${Depends}\n' desktop-commander | grep -F nodejs24
      - name: Upload deb files
        uses: actions/upload-artifact@v6
        with:
          name: debian-packages
          path: dist/*.deb
